<!DOCTYPE html>
<html>
<head>
    <title>Product Information System</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        .kritis {
            background-color: #ffcccc;
        }
    </style>
</head>
<body>

    <h2>Product Information System</h2>
    <p>Total Nilai Aset Gudang: Rp 766000</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Kategori</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Deskripsi</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Beras 5kg</td>
                <td>Sembako</td>
                <td>65000</td>
                <td>10</td>
                <td>Beras kualitas baik</td>
            </tr>
            <tr class="kritis">
                <td>2</td>
                <td>Minyak Goreng 2L</td>
                <td>Sembako</td>
                <td>32000</td>
                <td>2</td>
                <td>Minyak kelapa sawit</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Gula Pasir 1kg</td>
                <td>Sembako</td>
                <td>15000</td>
                <td>5</td>
                <td>Gula tebu murni</td>
            </tr>
            <tr class="kritis">
                <td>4</td>
                <td>Telur 1kg</td>
                <td>Sembako</td>
                <td>27000</td>
                <td>1</td>
                <td>Telur ayam segar</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
